name: Release
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  staging:
    if: vars.AUTO_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      target: staging
      source_sha: ${{ github.sha }}
      base_url: ${{ vars.STAGING_BASE_URL }}
    secrets: inherit
  production:
    needs: staging
    uses: ./.github/workflows/deploy.yml
    with:
      target: production
      source_sha: ${{ github.sha }}
      base_url: ${{ vars.PRODUCTION_BASE_URL }}
    secrets: inherit
