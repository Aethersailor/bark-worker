name: Release
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  production:
    if: vars.AUTO_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      target: production
      source_sha: ${{ github.sha }}
    secrets: inherit
