name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/bark-db/go.mod
          cache-dependency-path: tools/bark-db/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source, contracts, and build
        run: pnpm check

      - name: Audit all dependencies
        run: pnpm audit --audit-level high

  staging:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.AUTO_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      target: staging
      source_sha: ${{ github.sha }}
      base_url: ${{ vars.STAGING_BASE_URL }}
    secrets: inherit

  production:
    needs: [validate, staging]
    uses: ./.github/workflows/deploy.yml
    with:
      target: production
      source_sha: ${{ github.sha }}
      base_url: ${{ vars.PRODUCTION_BASE_URL }}
    secrets: inherit
