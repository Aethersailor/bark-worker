name: Dependabot workflow maintenance
'on':
  schedule:
  - cron: 11,41 * * * *
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: dependabot-workflow-maintenance
  cancel-in-progress: false
jobs:
  merge:
    if: github.repository == 'Aethersailor/bark-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Load the authorized repository allowlist
      id: targets
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        MAINTAINED_REPOSITORIES: ${{ secrets.DEPENDABOT_MERGE_REPOSITORIES }}
      with:
        script: |
          const targets = JSON.parse(process.env.MAINTAINED_REPOSITORIES);
          if (!Array.isArray(targets) || !targets.length || new Set(targets.map(t => t.id)).size !== targets.length ||
              !targets.every(t => Number.isInteger(t.id) && t.full_name.startsWith("Aethersailor/") && t.full_name.split("/").length === 2)) {
            throw new Error("The authorized maintenance repository allowlist is invalid.");
          }
          for (const target of targets) {
            if (target.private) {
              core.setSecret(target.full_name);
              core.setSecret(target.full_name.split("/")[1]);
            }
          }
          core.setOutput("repositories", targets.map(t => t.full_name.split("/")[1]).join(String.fromCharCode(10)));
    - name: Create a short-lived token for the authorized repositories
      id: maintenance-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      with:
        client-id: Iv23liPAfv8dJNAG2wBE
        private-key: ${{ secrets.DEPENDABOT_MERGE_APP_PRIVATE_KEY }}
        owner: Aethersailor
        repositories: ${{ steps.targets.outputs.repositories }}
        permission-actions: read
        permission-contents: write
        permission-pull-requests: write
        permission-workflows: write
    - name: Merge trusted workflow dependency updates
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        MAINTAINED_REPOSITORIES: ${{ secrets.DEPENDABOT_MERGE_REPOSITORIES }}
      with:
        github-token: ${{ steps.maintenance-token.outputs.token }}
        script: |
          const targets = JSON.parse(process.env.MAINTAINED_REPOSITORIES);
          const manifests = /(^|\/)(package(?:-lock)?\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock|go\.(mod|sum)|requirements[^/]*\.txt|pyproject\.toml|uv\.lock|Pipfile(?:\.lock)?|poetry\.lock|setup\.(py|cfg)|Cargo\.(toml|lock)|Gemfile(?:\.lock)?|composer\.(json|lock)|\.gitmodules|Dockerfile[^/]*|[^/]+\.dockerfile)$/i;
          const workflowFile = name => /^\.github\/workflows\/[^/]+\.ya?ml$/.test(name) || /^\.github\/actions\/.+\/action\.ya?ml$/.test(name);
          const errors = [];
          const results = [];
          let merged = 0;
          for (const target of targets) {
            if (target.private) {
              core.setSecret(target.full_name);
              core.setSecret(target.full_name.split("/")[1]);
            }
          }
          const {data: installationRepos} = await github.request("GET /installation/repositories", {per_page: 100});
          if (installationRepos.total_count !== targets.length ||
              !targets.every(t => installationRepos.repositories.some(r => r.id === t.id))) {
            throw new Error("The short-lived token does not cover exactly the authorized repository allowlist.");
          }
          for (const target of targets) {
            const [owner, repo] = target.full_name.split("/");
            const label = target.private ? `private repository ${targets.indexOf(target) + 1}` : target.full_name;
            let repositoryMerged = 0;
            let pending = 0;
            try {
              const {data: repository} = await github.rest.repos.get({owner, repo});
              if (owner !== "Aethersailor" || repository.id !== target.id ||
                  (repository.fork && !["geoip", "subweb"].includes(repo))) {
                throw new Error("Repository identity or maintenance scope has changed.");
              }
              if (repository.archived) {
                core.info(`${label} is archived; skipping maintenance.`);
                results.push([label, "0", "0", "archived"]);
                continue;
              }
              const base = repository.default_branch;
              const eligible = pr => pr.state === "open" && !pr.draft &&
                pr.user.login === "dependabot[bot]" && pr.user.type === "Bot" &&
                pr.base.ref === base && pr.base.repo.full_name === repository.full_name &&
                pr.head.repo?.full_name === repository.full_name && pr.head.ref.startsWith("dependabot/");
              const candidates = await github.paginate(github.rest.pulls.list, {owner, repo, state: "open", base, per_page: 100});
              for (const candidate of candidates) {
                let {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: candidate.number});
                if (!eligible(pr)) continue;
                const files = await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number: pr.number, per_page: 100});
                if (!files.some(f => workflowFile(f.filename))) continue;
                if (files.length !== pr.changed_files || !files.every(f => workflowFile(f.filename) || manifests.test(f.filename))) {
                  pending++;
                  core.warning(`${label} #${pr.number} changes files outside dependency updates.`);
                  continue;
                }
                const head = pr.head.sha;
                const {data: commit} = await github.rest.repos.getCommit({owner, repo, ref: head});
                if (!commit.commit.verification?.verified) {
                  pending++;
                  core.warning(`${label} #${pr.number} does not have a verified head commit.`);
                  continue;
                }
                for (let attempt = 0; pr.mergeable === null && attempt < 3; attempt++) {
                  await new Promise(resolve => setTimeout(resolve, 2000));
                  ({data: pr} = await github.rest.pulls.get({owner, repo, pull_number: pr.number}));
                }
                if (!eligible(pr) || pr.head.sha !== head) {
                  pending++;
                  continue;
                }
                if (pr.mergeable === null) {
                  pending++;
                  core.info(`${label} #${pr.number} is awaiting GitHub mergeability calculation.`);
                  continue;
                }
                if (pr.mergeable === false) {
                  pending++;
                  try {
                    await github.rest.pulls.updateBranch({owner, repo, pull_number: pr.number, expected_head_sha: head});
                    core.info(`${label} #${pr.number} was updated; the next scheduled run will reconcile it.`);
                  } catch (error) {
                    if (![409, 422].includes(error.status)) throw error;
                    core.warning(`${label} #${pr.number} is awaiting Dependabot conflict reconciliation.`);
                  }
                  continue;
                }
                const {data: fresh} = await github.rest.pulls.get({owner, repo, pull_number: pr.number});
                if (!eligible(fresh) || fresh.head.sha !== head || fresh.base.sha !== pr.base.sha) {
                  pending++;
                  continue;
                }
                try {
                  const {data: result} = await github.rest.pulls.merge({owner, repo, pull_number: pr.number, sha: head, merge_method: "squash"});
                  if (!result.merged) throw new Error(result.message || "GitHub did not merge the dependency update.");
                  merged++;
                  repositoryMerged++;
                  core.info(`Merged ${label} #${pr.number} at ${result.sha}.`);
                } catch (error) {
                  if (![405, 409, 422].includes(error.status)) throw error;
                  pending++;
                  core.warning(`${label} #${pr.number} changed or is awaiting GitHub reconciliation.`);
                }
              }
              results.push([label, String(repositoryMerged), String(pending), "processed"]);
            } catch (error) {
              errors.push(`${label}: HTTP ${error.status || "n/a"}: ${error.message}`);
              results.push([label, String(repositoryMerged), String(pending), "error"]);
            }
          }
          for (const error of errors) core.error(error);
          await core.summary.addHeading("Dependabot workflow dependency maintenance")
            .addRaw(`Checked ${targets.length} repositories; merged ${merged} workflow dependency updates.`)
            .addTable([[{data: "Repository", header: true}, {data: "Merged", header: true}, {data: "Pending", header: true}, {data: "Result", header: true}], ...results])
            .write();
          if (errors.length) core.setFailed(`${errors.length} repositories could not be processed; see the job summary.`);
