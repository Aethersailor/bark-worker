name: Deploy

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      base_url:
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
  workflow_dispatch:
    inputs:
      target:
        description: Cloudflare environment
        required: true
        type: choice
        options: [staging, production]
      source_sha:
        description: Git commit to embed; defaults to the selected revision
        required: false
        type: string
      base_url:
        description: Public base URL for smoke verification
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bark-worker-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ inputs.target }}
      BASE_URL: ${{ inputs.base_url }}
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - name: Validate target
        shell: bash
        run: |
          case "$TARGET" in
            staging|production) ;;
            *) echo "Unsupported target: $TARGET" >&2; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source
        run: pnpm check

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --env "$TARGET" --remote

      - name: Prepare pinned APNs secret
        shell: bash
        run: node scripts/print-upstream-apns-key.mjs upstream/UPSTREAM.lock.json --json-output "$RUNNER_TEMP/bark-worker-secrets.json"

      - name: Deploy Worker
        shell: bash
        run: |
          upstream_sha=$(node -p "require('./upstream/UPSTREAM.lock.json').commit")
          version=$(node -p "require('./package.json').version")
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          pnpm exec wrangler deploy \
            --env "$TARGET" \
            --strict \
            --minify \
            --upload-source-maps \
            --tag "$SOURCE_SHA" \
            --message "GitHub Actions $SOURCE_SHA" \
            --secrets-file "$RUNNER_TEMP/bark-worker-secrets.json" \
            --var "APP_VERSION:$version" \
            --var "APP_BUILD:$build_date" \
            --var "APP_COMMIT:$SOURCE_SHA" \
            --var "UPSTREAM_COMMIT:$upstream_sha"
          rm -f "$RUNNER_TEMP/bark-worker-secrets.json"

      - name: Verify public runtime
        run: node scripts/smoke.mjs "$BASE_URL" "$SOURCE_SHA" "$(node -p "require('./upstream/UPSTREAM.lock.json').commit")"
