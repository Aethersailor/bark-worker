name: One-time encrypted Dependabot secret migration
on:
  workflow_dispatch:
    inputs:
      public_keys:
        description: Destination encryption public keys
        required: true
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install GitHub-documented encryption library
        run: python3 -m pip install --disable-pip-version-check PyNaCl==1.6.2
      - name: Encrypt existing credential for each destination
        env:
          APP_PRIVATE_KEY: ${{ secrets.DEPENDABOT_MERGE_APP_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          from nacl import encoding, public
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          destinations = json.loads(event['inputs']['public_keys'])
          secret = os.environ['APP_PRIVATE_KEY'].encode()
          output = []
          for item in destinations:
              key = public.PublicKey(item['key'].encode(), encoding.Base64Encoder())
              encrypted = public.SealedBox(key).encrypt(secret)
              output.append({'slot':item['slot'], 'app':item['app'], 'key_id':item['key_id'],
                             'encrypted_value':base64.b64encode(encrypted).decode()})
          Path('sealed-secrets.json').write_text(json.dumps(output))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sealed-dependabot-secrets
          path: sealed-secrets.json
          retention-days: 1
